# =====================================================================
# Configuration des TESTS (src/test/resources/application.properties)
# Ce fichier prend le pas sur celui de src/main pendant les tests.
#
# Objectif : faire tourner les tests d'intégration sur H2 en mémoire,
# SANS Flyway (les migrations sont écrites pour PostgreSQL : SERIAL,
# ADD COLUMN ... ADD CONSTRAINT ..., schéma "biblio" → H2 les refuse).
# Le schéma est alors généré par Hibernate à partir des entités, puis
# détruit après les tests (ddl-auto=create-drop).
# =====================================================================

# On coupe Flyway uniquement pour les tests
spring.flyway.enabled=false

# Hibernate crée/détruit le schéma depuis les entités
spring.jpa.hibernate.ddl-auto=create-drop

# Même stratégie de nommage qu'en prod (noms de colonnes = noms de champs)
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl